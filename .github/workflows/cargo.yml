name: cargo-build

on:
  push:
    branches: [main, release/5.x]
    paths-ignore:
      - 'site/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'site/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

# A newer commit replaces a PR run. Push runs keep their own group so every
# main/release commit still gets its release-profile validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - name: Install dependencies
        shell: bash
        run: |
          # The runner image ships a Google Chrome apt source we do not use.
          # While Google republishes, its Packages index and Release file
          # disagree, and `apt-get update` exits non-zero on ANY failed index --
          # failing the job even though it already ignored the bad one and every
          # package we install comes from the Ubuntu archive. Drop the source we
          # do not need rather than ignore all failures, which would hide a real
          # archive outage as a confusing "package not found" later.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get -y install libelf-dev
      - name: cargo check
        run: |
          rustup component add rustfmt
          cargo check --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          # clippy-deny writes the same dependency cache.
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: clippy-sarif,sarif-fmt
      - name: Install dependencies
        shell: bash
        run: |
          # Drop the unused Chrome apt source; see the note in `check`.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get -y install libelf-dev
      # Reporting, not gating: this feeds GitHub code scanning, and its exit
      # status is `sarif-fmt`'s rather than clippy's because of the pipe. Left
      # `continue-on-error` so a lint never costs us the SARIF upload.
      - name: run clippy (sarif report)
        run: |
          cargo clippy --all-targets --all-features --message-format json \
            | clippy-sarif \
            | tee clippy.sarif \
            | sarif-fmt
        shell: bash
        continue-on-error: true
      - uses: actions/upload-artifact@v5
        with:
          name: clippy-sarif
          path: clippy.sarif

  # The gate, deliberately its own job.
  #
  # It cannot live in `clippy`: that job's last step uploads the SARIF, and a
  # failing step before it skips the upload and the `clippy-upload` job with
  # it — trading a lint for the loss of code scanning. It also cannot be a flag
  # on the reporting step, which fails to gate for three separate reasons: no
  # `-D warnings` (lints stay warnings, clippy exits 0), a pipe through
  # `clippy-sarif` (the status is `sarif-fmt`'s), and `continue-on-error`.
  #
  # Unpiped, denying warnings, allowed to fail. Note `--all-features`: it
  # enables `developer-mode`, which changes cfg, so a check without it covers
  # less than this does.
  clippy-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          # Keep dependency caches even when a lint fails the gate.
          cache-on-failure: true
      - name: Install dependencies
        shell: bash
        run: |
          # Drop the unused Chrome apt source; see the note in `check`.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get -y install libelf-dev
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
        shell: bash

  clippy-upload:
    runs-on: ubuntu-latest
    needs: [ clippy ]
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v5
      with:
        name: clippy-sarif
    - uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: clippy.sarif

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      # Audit only reads Cargo.lock; restoring compiled agent dependencies and
      # compiling the audit tool add work without checking any more code.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: |
          cargo audit

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        shell: bash
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

  # WASM viewer is wasm32-only and excluded from the regular build
  # matrix above. Build it from source here so Rust-side breakage in
  # crates/viewer/ surfaces at PR time, then structurally validate the
  # rebuilt WASM before the static-site deploy uses the same build path.
  #
  # Building with the wrong binaryen silently produces a broken WASM —
  # e.g. binaryen 108 mis-orders the externref table so the
  # `__wbindgen_externrefs` export points at the locked funcref table,
  # and the JS shim then fails at instantiation with
  # `Table.grow(): failed to grow table by 4`.
  wasm-viewer:
    name: wasm-viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-wasm
      - name: Install wabt
        run: |
          # Drop the unused Chrome apt source; see the note in `check`.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get -y install wabt
      # The `.rez` reader has to keep compiling for the browser. Its default
      # feature set does NOT: the ingest half pulls `metriken`, whose registry
      # declares a `linkme` distributed slice, and `linkme` has no wasm32
      # implementation. Nothing else catches a metriken type creeping back onto
      # the read path — the native build stays green, and the WASM viewer only
      # fails once it actually depends on this crate.
      - name: Check the .rez reader still builds for wasm32
        run: cargo check -p rez --no-default-features --target wasm32-unknown-unknown --locked
      - name: Rebuild WASM viewer
        run: ./crates/viewer/build.sh
      # The JS suite runs HERE rather than in its own job because four of its
      # files drive the built bundle (tests/wasm_viewer_*.test.mjs); anywhere
      # else they skip themselves and prove nothing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the viewer JS tests
        run: node --test tests/*.mjs
      - name: Check template symlinks are committed
        # build.sh self-heals missing symlinks under site/viewer/templates/
        # so the deploy doesn't break, but the symlinks must also be in
        # git so this isn't a CI-only fix. Fail PRs that add a template
        # without the matching symlink.
        run: |
          missing=$(git status --porcelain site/viewer/templates/ | awk '$1 == "??" {print $2}')
          if [ -n "$missing" ]; then
            echo "::error::crates/dashboard/templates/ entries are missing symlinks under site/viewer/templates/. Add them so the static-site viewer can serve the JSON:"
            echo "$missing" | sed 's/^/  /'
            exit 1
          fi
      - name: Validate rebuilt WASM structure
        run: |
          wasm=site/viewer/pkg/wasm_viewer_bg.wasm
          # Find which table index the JS shim's externref slot is
          # exported from, then confirm that table is actually an
          # externref table. binaryen 108 swaps these and routes the
          # export at the locked funcref table.
          export_idx=$(wasm-objdump -x "$wasm" \
            | grep -E '__wbindgen_externrefs' \
            | grep -oE 'table\[[0-9]+\]' \
            | head -1 \
            | grep -oE '[0-9]+')
          if [ -z "$export_idx" ]; then
            echo "::error file=$wasm::no __wbindgen_externrefs export found"
            exit 1
          fi
          target_table=$(wasm-objdump -x "$wasm" | grep -E "^ - table\\[$export_idx\\] type=")
          if ! echo "$target_table" | grep -q externref; then
            echo "::error file=$wasm::__wbindgen_externrefs is exported from table[$export_idx], which is not an externref table."
            echo ""
            wasm-objdump -x "$wasm" | grep -E '^ - table\[|__wbindgen_externrefs' | sed 's/^/    /'
            echo ""
            echo "Rebuild with the canonical toolchain: ./crates/viewer/build.sh"
            echo "(needs wasm-pack >= 0.14, which pins binaryen 117)."
            exit 1
          fi

  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.set-profiles.outputs.profiles }}
    steps:
      - name: determine build profiles
        id: set-profiles
        run: |
          # PRs build debug only; release builds run on push (to main) and
          # in release.yml at tag time, where packaging happens.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'profiles=["debug"]' >> $GITHUB_OUTPUT
          else
            echo 'profiles=["release", "debug"]' >> $GITHUB_OUTPUT
          fi

  # The setup job selects debug-only PR builds and both profiles on pushes.
  build:
    # Keep the existing check names (including the empty former feature suffix).
    # Rename only together with any required status checks in main/release rulesets.
    name: build-${{ matrix.os }}-${{ matrix.profile }}-
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, macos-latest ]
        profile: ${{ fromJson(needs.setup.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - name: Update cargo flags
        if: ${{ matrix.profile == 'release' }}
        run: |
          echo 'FLAGS=--release' >> $GITHUB_ENV
          echo 'CARGO_BUILD_JOBS=2' >> $GITHUB_ENV
          echo 'CARGO_PROFILE_RELEASE_LTO=false' >> $GITHUB_ENV
        shell: bash
      - name: Update cargo flags
        if: ${{ matrix.profile == 'debug' }}
        run: echo 'FLAGS=' >> $GITHUB_ENV
        shell: bash
      # Include the release overrides above in the cache's environment hash.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}-${{ matrix.profile }}-

      - name: Install dependencies
        if: ${{ matrix.os != 'macos-latest' }}
        shell: bash
        run: |
          # Drop the unused Chrome apt source; see the note in `check`.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get -y install libelf-dev
          rustup component add rustfmt

      # viewer is a wasm32-only workspace member; it is built via
      # crates/viewer/build.sh rather than in the main CI pipeline.
      - name: build
        shell: bash
        run: |
          cargo build --workspace --exclude viewer ${{ env.FEATURE_FLAGS }} --all-targets --locked ${{ env.FLAGS }}
      - name: test
        shell: bash
        run: |
          cargo test --workspace --exclude viewer ${{ env.FEATURE_FLAGS }} --tests --bins --locked ${{ env.FLAGS }}
      # The WASM viewer is excluded above because it is built for wasm32 by
      # crates/viewer/build.sh, not by this matrix. Its BEHAVIOR still needs
      # checking, though — which container an uploaded capture is, and which
      # slots a multi-recording archive fills, are decisions that would
      # otherwise be covered by nothing. wasm-bindgen's generated code compiles
      # natively (only the JS interop would panic there, and none of it runs in
      # these tests), so the crate is testable on this host.
      - name: test wasm viewer
        shell: bash
        run: |
          cargo test -p viewer --locked ${{ env.FLAGS }}
      - name: doctests
        if: ${{ matrix.profile == 'debug' }}
        shell: bash
        run: |
          cargo test --workspace --exclude viewer ${{ env.FEATURE_FLAGS }} --doc --locked -- --test-threads 16
      # The smoketest agent runs every sampler, including the opt-in ones that
      # config/agent.toml leaves at `enabled = false`, so that the sampler
      # health step below covers them.
      - name: smoketest config
        shell: bash
        run: |
          sed 's/^enabled = false$/enabled = true/' config/agent.toml > smoketest.toml
          ! grep -q '^enabled = false' smoketest.toml
      # Rebuild without test targets: --all-targets unifies dev-dependency
      # features (including rez/test-support) into the earlier agent binary.
      - name: smoketest
        if: ${{ matrix.profile == 'release' }}
        shell: bash
        run: |
          cargo build ${{ env.FEATURE_FLAGS }} --locked ${{ env.FLAGS }}
          sudo ./target/release/rezolus smoketest.toml & echo $! > agent.pid
          sleep 15
          ./target/release/rezolus record --duration 30s --url http://127.0.0.1:4241 -o long.dendro
          test -s long.dendro
          # default output: no -o means rezolus.dendro, which exercises the
          # archive writer, finalization, and reading the archive back
          ./target/release/rezolus record --duration 10s --url http://127.0.0.1:4241
          test -s rezolus.dendro
          ./target/release/rezolus recording metadata -i rezolus.dendro
          # 6.x writes .dendro only: a 5.x output format is refused as a usage
          # error (exit 2) and nothing is written
          code=0
          ./target/release/rezolus record --duration 10s --url http://127.0.0.1:4241 -o rezolus.rez || code=$?
          test "$code" -eq 2
          test ! -e rezolus.rez
          # wrap mode: record a command against the live agent for its lifetime
          ./target/release/rezolus record --url http://127.0.0.1:4241 -o wrap.dendro -- sleep 3
          test -s wrap.dendro
          # exit-code propagation: a wrapped 'false' must exit non-zero
          code=0
          ./target/release/rezolus record -o false.dendro -- false || code=$?
          test "$code" -ne 0
          # --duration cap: a long command is terminated and record exits 124 quickly
          start=$(date +%s)
          code=0
          ./target/release/rezolus record --duration 2s -o cap.dendro -- sleep 60 || code=$?
          test "$code" -eq 124
          test "$(( $(date +%s) - start ))" -lt 10
      - name: smoketest
        if: ${{ matrix.profile == 'debug' }}
        shell: bash
        run: |
          cargo build ${{ env.FEATURE_FLAGS }} --locked ${{ env.FLAGS }}
          sudo ./target/debug/rezolus smoketest.toml & echo $! > agent.pid
          sleep 15
          ./target/debug/rezolus record --duration 30s --url http://127.0.0.1:4241 -o long.dendro
          test -s long.dendro
          # default output: no -o means rezolus.dendro, which exercises the
          # archive writer, finalization, and reading the archive back
          ./target/debug/rezolus record --duration 10s --url http://127.0.0.1:4241
          test -s rezolus.dendro
          ./target/debug/rezolus recording metadata -i rezolus.dendro
          # 6.x writes .dendro only: a 5.x output format is refused as a usage
          # error (exit 2) and nothing is written
          code=0
          ./target/debug/rezolus record --duration 10s --url http://127.0.0.1:4241 -o rezolus.rez || code=$?
          test "$code" -eq 2
          test ! -e rezolus.rez
          # wrap mode: record a command against the live agent for its lifetime
          ./target/debug/rezolus record --url http://127.0.0.1:4241 -o wrap.dendro -- sleep 3
          test -s wrap.dendro
          # exit-code propagation: a wrapped 'false' must exit non-zero
          code=0
          ./target/debug/rezolus record -o false.dendro -- false || code=$?
          test "$code" -ne 0
          # --duration cap: a long command is terminated and record exits 124 quickly
          start=$(date +%s)
          code=0
          ./target/debug/rezolus record --duration 2s -o cap.dendro -- sleep 60 || code=$?
          test "$code" -eq 124
          test "$(( $(date +%s) - start ))" -lt 10
      # `rezolus status` exits 1 when any sampler failed to load or is
      # degraded. The JSON check fails the step if a sampler was left disabled,
      # which would mean the smoketest config did not enable it.
      - name: sampler health
        shell: bash
        run: |
          uname -sr
          ./target/${{ matrix.profile }}/rezolus status
          ./target/${{ matrix.profile }}/rezolus status --json \
            | jq -e '[.samplers[] | select(.state == "disabled") | .name] | if length == 0 then true else (., false) end'

  check-success:
    name: verify all tests pass
    if: always()
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
      - check
      - rustfmt
      - clippy
      - clippy-deny
      - clippy-upload
      - wasm-viewer

    steps:
      - name: verify
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required checks failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "All checks passed!"
