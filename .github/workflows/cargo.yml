name: cargo-build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'site/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-${{ matrix.os }}
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt-get -y install libelf-dev
      - name: cargo check
        run: |
          rustup component add rustfmt
          cargo check --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: clippy-sarif,sarif-fmt
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt-get -y install libelf-dev
      # Reporting, not gating: this feeds GitHub code scanning, and its exit
      # status is `sarif-fmt`'s rather than clippy's because of the pipe. Left
      # `continue-on-error` so a lint never costs us the SARIF upload.
      - name: run clippy (sarif report)
        run: |
          cargo clippy --all-targets --all-features --message-format json \
            | clippy-sarif \
            | tee clippy.sarif \
            | sarif-fmt
        shell: bash
        continue-on-error: true
      - uses: actions/upload-artifact@v5
        with:
          name: clippy-sarif
          path: clippy.sarif

  # The gate, deliberately its own job.
  #
  # It cannot live in `clippy`: that job's last step uploads the SARIF, and a
  # failing step before it skips the upload and the `clippy-upload` job with
  # it — trading a lint for the loss of code scanning. It also cannot be a flag
  # on the reporting step, which fails to gate for three separate reasons: no
  # `-D warnings` (lints stay warnings, clippy exits 0), a pipe through
  # `clippy-sarif` (the status is `sarif-fmt`'s), and `continue-on-error`.
  #
  # Unpiped, denying warnings, allowed to fail. Note `--all-features`: it
  # enables `developer-mode`, which changes cfg, so a check without it covers
  # less than this does.
  clippy-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt-get -y install libelf-dev
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
        shell: bash

  clippy-upload:
    runs-on: ubuntu-latest
    needs: [ clippy ]
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v5
      with:
        name: clippy-sarif
    - uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: clippy.sarif

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-ubuntu-latest
          save-if: false
      - name: install cargo-audit
        # `--locked` uses cargo-audit's own committed Cargo.lock. Without it,
        # `cargo install` resolves the tool's dependencies fresh against
        # crates.io and a broken upstream release breaks the audit job for
        # every PR — e.g. tinyvec 1.13.0 (2026-09-03) fails to compile
        # (`cannot find macro vec`), which has nothing to do with this repo's
        # own dependency tree. `wasm-pack` below is pinned for the same reason.
        run: cargo install cargo-audit --locked
      - run: |
          cargo audit

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        shell: bash
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

  # WASM viewer is wasm32-only and excluded from the regular build
  # matrix above. Build it from source here so Rust-side breakage in
  # crates/viewer/ surfaces at PR time, then structurally validate the
  # rebuilt WASM before the static-site deploy uses the same build path.
  #
  # Building with the wrong binaryen silently produces a broken WASM —
  # e.g. binaryen 108 mis-orders the externref table so the
  # `__wbindgen_externrefs` export points at the locked funcref table,
  # and the JS shim then fails at instantiation with
  # `Table.grow(): failed to grow table by 4`.
  wasm-viewer:
    name: wasm-viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --version ^0.14 --locked
      - name: Install wabt
        run: sudo apt-get update && sudo apt-get -y install wabt
      # The `.rez` reader has to keep compiling for the browser. Its default
      # feature set does NOT: the ingest half pulls `metriken`, whose registry
      # declares a `linkme` distributed slice, and `linkme` has no wasm32
      # implementation. Nothing else catches a metriken type creeping back onto
      # the read path — the native build stays green, and the WASM viewer only
      # fails once it actually depends on this crate.
      - name: Check the .rez reader still builds for wasm32
        run: cargo check -p rez --no-default-features --target wasm32-unknown-unknown --locked
      - name: Rebuild WASM viewer
        run: ./crates/viewer/build.sh
      # The JS suite runs HERE rather than in its own job because four of its
      # files drive the built bundle (tests/wasm_viewer_*.test.mjs); anywhere
      # else they skip themselves and prove nothing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the viewer JS tests
        run: node --test tests/*.mjs
      - name: Check template symlinks are committed
        # build.sh self-heals missing symlinks under site/viewer/templates/
        # so the deploy doesn't break, but the symlinks must also be in
        # git so this isn't a CI-only fix. Fail PRs that add a template
        # without the matching symlink.
        run: |
          missing=$(git status --porcelain site/viewer/templates/ | awk '$1 == "??" {print $2}')
          if [ -n "$missing" ]; then
            echo "::error::config/templates/ entries are missing symlinks under site/viewer/templates/. Add them so the static-site viewer can serve the JSON:"
            echo "$missing" | sed 's/^/  /'
            exit 1
          fi
      - name: Validate rebuilt WASM structure
        run: |
          wasm=site/viewer/pkg/wasm_viewer_bg.wasm
          # Find which table index the JS shim's externref slot is
          # exported from, then confirm that table is actually an
          # externref table. binaryen 108 swaps these and routes the
          # export at the locked funcref table.
          export_idx=$(wasm-objdump -x "$wasm" \
            | grep -E '__wbindgen_externrefs' \
            | grep -oE 'table\[[0-9]+\]' \
            | head -1 \
            | grep -oE '[0-9]+')
          if [ -z "$export_idx" ]; then
            echo "::error file=$wasm::no __wbindgen_externrefs export found"
            exit 1
          fi
          target_table=$(wasm-objdump -x "$wasm" | grep -E "^ - table\\[$export_idx\\] type=")
          if ! echo "$target_table" | grep -q externref; then
            echo "::error file=$wasm::__wbindgen_externrefs is exported from table[$export_idx], which is not an externref table."
            echo ""
            wasm-objdump -x "$wasm" | grep -E '^ - table\[|__wbindgen_externrefs' | sed 's/^/    /'
            echo ""
            echo "Rebuild with the canonical toolchain: ./crates/viewer/build.sh"
            echo "(needs wasm-pack >= 0.14, which pins binaryen 117)."
            exit 1
          fi

  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.set-profiles.outputs.profiles }}
    steps:
      - name: determine build profiles
        id: set-profiles
        run: |
          # PRs build debug only; release builds run on push (to main) and
          # in release.yml at tag time, where packaging happens.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'profiles=["debug"]' >> $GITHUB_OUTPUT
          else
            echo 'profiles=["release", "debug"]' >> $GITHUB_OUTPUT
          fi

  # Second group of checks: These are more expensive than the first set so we
  # gate them on the check action succeeding.
  build:
    name: build-${{ matrix.os }}-${{ matrix.profile }}-${{ matrix.features }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04, ubuntu-22.04, macos-latest ]
        profile: ${{ fromJson(needs.setup.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}-${{ matrix.profile }}-${{ matrix.features }}

      - name: Update cargo flags
        if: ${{ matrix.profile == 'release' }}
        run: |
          echo 'FLAGS=--release' >> $GITHUB_ENV
          echo 'CARGO_BUILD_JOBS=2' >> $GITHUB_ENV
          echo 'CARGO_PROFILE_RELEASE_LTO=false' >> $GITHUB_ENV
        shell: bash
      - name: Update cargo flags
        if: ${{ matrix.profile == 'debug' }}
        run: echo 'FLAGS=' >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies
        if: ${{ matrix.os != 'macos-latest' }}
        shell: bash
        run: |
          sudo apt update
          sudo apt-get -y install libelf-dev
          rustup component add rustfmt

      # viewer is a wasm32-only workspace member; it is built via
      # crates/viewer/build.sh rather than in the main CI pipeline.
      - name: build
        shell: bash
        run: |
          cargo build --workspace --exclude viewer ${{ env.FEATURE_FLAGS }} --all-targets --locked ${{ env.FLAGS }}
      - name: test
        shell: bash
        run: |
          cargo test --workspace --exclude viewer ${{ env.FEATURE_FLAGS }} --tests --bins --locked ${{ env.FLAGS }}
      # The WASM viewer is excluded above because it is built for wasm32 by
      # crates/viewer/build.sh, not by this matrix. Its BEHAVIOR still needs
      # checking, though — which container an uploaded capture is, and which
      # slots a multi-recording archive fills, are decisions that would
      # otherwise be covered by nothing. wasm-bindgen's generated code compiles
      # natively (only the JS interop would panic there, and none of it runs in
      # these tests), so the crate is testable on this host.
      - name: test wasm viewer
        shell: bash
        run: |
          cargo test -p viewer --locked ${{ env.FLAGS }}
      - name: doctests
        if: ${{ matrix.profile == 'debug' }}
        shell: bash
        run: |
          cargo test --workspace --exclude viewer ${{ env.FEATURE_FLAGS }} --locked -- --test-threads 16
      - name: smoketest
        if: ${{ matrix.profile == 'release' }}
        shell: bash
        run: |
          cargo build ${{ env.FEATURE_FLAGS }} --locked ${{ env.FLAGS }}
          sudo ./target/release/rezolus config/agent.toml & echo $! > agent.pid
          sleep 15
          ./target/release/rezolus record --duration 30s http://127.0.0.1:4241 rezolus.parquet
          # wrap mode: record a command against the live agent for its lifetime
          ./target/release/rezolus record --url http://127.0.0.1:4241 -o wrap.parquet -- sleep 3
          test -s wrap.parquet
          # exit-code propagation: a wrapped 'false' must exit non-zero
          code=0
          ./target/release/rezolus record -o false.parquet -- false || code=$?
          test "$code" -ne 0
          # --duration cap: a long command is terminated and record exits 124 quickly
          start=$(date +%s)
          code=0
          ./target/release/rezolus record --duration 2s -o cap.parquet -- sleep 60 || code=$?
          test "$code" -eq 124
          test "$(( $(date +%s) - start ))" -lt 10
      - name: smoketest
        if: ${{ matrix.profile == 'debug' }}
        shell: bash
        run: |
          cargo build ${{ env.FEATURE_FLAGS }} --locked ${{ env.FLAGS }}
          sudo ./target/debug/rezolus config/agent.toml & echo $! > agent.pid
          sleep 15
          ./target/debug/rezolus record --duration 30s http://127.0.0.1:4241 rezolus.parquet
          # wrap mode: record a command against the live agent for its lifetime
          ./target/debug/rezolus record --url http://127.0.0.1:4241 -o wrap.parquet -- sleep 3
          test -s wrap.parquet
          # exit-code propagation: a wrapped 'false' must exit non-zero
          code=0
          ./target/debug/rezolus record -o false.parquet -- false || code=$?
          test "$code" -ne 0
          # --duration cap: a long command is terminated and record exits 124 quickly
          start=$(date +%s)
          code=0
          ./target/debug/rezolus record --duration 2s -o cap.parquet -- sleep 60 || code=$?
          test "$code" -eq 124
          test "$(( $(date +%s) - start ))" -lt 10

  check-success:
    name: verify all tests pass
    if: always()
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
      - check
      - rustfmt
      - clippy
      - clippy-deny
      - clippy-upload

    steps:
      - name: verify
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required checks failed or were cancelled."
            exit 1
          fi
          echo "All checks passed!"
