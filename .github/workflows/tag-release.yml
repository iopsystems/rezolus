# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Tag Release

on:
  push:
    # release/5.x carries 5.x after main moved to 6.0 (#1346).
    branches: [main, release/5.x]

jobs:
  tag-release:
    uses: brayniac/rust-workflows/.github/workflows/tag-release.yml@v1
    # By name, not `secrets: inherit`: GitHub only carries inherited secrets
    # between repositories in the same organization, and the shared workflow
    # lives under a different owner. With `inherit` the token arrives empty
    # and checkout fails after the gate has already passed.
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      # rezolus pushes the next development version straight to main rather
      # than opening a bump PR for it. The shared workflow pushes that bump to
      # main whichever branch was tagged, so a maintenance branch skips it and
      # keeps its released version until its next release PR.
      dev-bump: ${{ github.ref_name == 'main' && 'direct' || 'none' }}
      # A fork's main must not tag.
      only-repository: iopsystems/rezolus
