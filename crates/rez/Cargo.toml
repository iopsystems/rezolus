[package]
name = "rez"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
arrow = "58.2.0"
bytes = "1"
histogram.workspace = true
metriken = { workspace = true, optional = true }
metriken-exposition = { workspace = true, optional = true }
metriken-query.workspace = true
parquet = { version = "58.2.0", default-features = false, features = [
    "arrow",
    "simdutf8",
    "zstd",
    # `Compression::LZ4_RAW`, the codec `.rez` segments are written with. Pulls
    # in `lz4_flex` (pure Rust, no C). See `rez::segment_writer_props`.
    "lz4",
] }
rusqlite = { version = "0.40", features = ["bundled", "blob", "serialize"] }
rmp-serde = "1.3.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tar = { version = "0.4.45", default-features = false }
tempfile = "3"
tracing = "0.1"

[features]
default = ["write"]
# Everything that turns an agent snapshot into archive rows: the ingest path
# and both writers. Off, the crate is a READER — which is the configuration
# that compiles for wasm32, since `metriken`'s registry (`metriken-core`)
# declares a `linkme` distributed slice and `linkme` has no wasm32
# implementation.
write = [
    "dep:metriken",
    "dep:metriken-exposition",
    "metriken-query/ingest",
]
# Fixture builders used by the binary crate's tests. Not `#[cfg(test)]`,
# because a `#[cfg(test)]` module in THIS crate is invisible to the crate
# under test next door.
test-support = ["write"]

[dev-dependencies]
tempfile = "3"
