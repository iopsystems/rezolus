[package]
name = "rez"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
arrow = "60.0.0"
bytes = "1"
# `combined::parquet_source_label` and `keys`, for the parquet conversion
# `legacy` runs.
dashboard.workspace = true
# Reader-only by default (see the workspace entry); `write` below turns
# dendro's append side on alongside rez's own.
dendro = { workspace = true, features = ["archive"] }
histogram.workspace = true
metriken = { workspace = true, optional = true }
metriken-exposition = { workspace = true, optional = true }
# `archive`: `MetricsSource` for `ArchiveReader` and `eval_timestamps_for`,
# which the read path needs in every configuration, the wasm viewer's included.
metriken-query = { workspace = true, features = ["archive"] }
# `write` for the converters (`to_dendro`, `ParquetToArchive`), which the
# viewers run on a `.rez` or parquet file they load (`legacy`). They write an
# in-memory `ArchiveMut` and spawn no thread, so they run in the browser.
metriken-storage = { workspace = true, features = ["rez", "write"] }
parquet = { version = "60.0.0", default-features = false, features = [
    "arrow",
    "simdutf8",
    "zstd",
    # `Compression::LZ4_RAW`, the codec `.rez` segments were written with.
    # Pulls in `lz4_flex` (pure Rust, no C).
    "lz4",
] }
rusqlite = { version = "0.41", features = ["bundled", "blob", "serialize"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tar = { version = "0.4.45", default-features = false }
tempfile = "3"
tracing = "0.1"

[features]
default = ["write"]
# Everything that turns an agent snapshot into archive rows: the ingest path
# and the stream subscription. Off, the crate reads archives and converts a
# `.rez` or parquet file in memory (`legacy`), with no `metriken` registry,
# which is the configuration that compiles for wasm32: `metriken`'s registry
# (`metriken-core`) declares a `linkme` distributed slice and `linkme` has no
# wasm32 implementation.
write = [
    "dep:metriken",
    "dep:metriken-exposition",
    "metriken-query/ingest",
    # dendro's append side. The converters in `legacy` need it too, so the
    # base `metriken-storage` dependency turns it on in every configuration
    # (its `write`); it compiles for wasm32, and the converters and in-memory
    # archives use no writer thread.
    "dendro/write",
    # `StreamRow` for `wire::AgentRow` and `Pass` for `wire::AgentRows`, so
    # the agent's stream subscriptions read the rows it already built for
    # `/metrics/rows` without converting them.
    "metriken-storage/stream",
]
# Fixture builders used by the binary crate's tests. Not `#[cfg(test)]`,
# because a `#[cfg(test)]` module in THIS crate is invisible to the crate
# under test next door.
test-support = ["write"]

# Builds only with `test-support`, which is what supplies the fixture builders
# it calls. Declared rather than left implicit because `--all-targets` compiles
# examples: without this, `cargo check -p rez --all-targets` fails on a crate
# that is otherwise fine, and it fails for a reason that looks like a broken
# crate rather than a missing feature.
[[example]]
name = "write_fixture"
required-features = ["test-support"]

[dev-dependencies]
metriken-storage = { workspace = true, features = ["rez"] }
tempfile = "3"
