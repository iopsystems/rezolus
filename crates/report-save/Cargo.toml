[package]
name = "report-save"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
dashboard.workspace = true
metriken-query.workspace = true
tracing = "0.1"
# Reader-only: a report must build without `metriken`, so the WASM viewer can
# build one in the browser. The binary unifies this to the full `write` build
# via its own dependency.
rez = { path = "../rez", default-features = false }
# A report is a dendro archive: dendro's copy and metriken-storage's encoder
# and column filter. `write` is metriken-storage's archive writer, which
# needs no `metriken` and spawns no thread on these paths (the crate checks
# for wasm32 with `rez` and `write`).
dendro = { workspace = true, features = ["archive"] }
metriken-storage = { workspace = true, features = ["archive", "rez", "write"] }

# The tests build parquet fixtures and convert them, as `recording upgrade`
# does, into the dendro archives a report is built from.
[dev-dependencies]
arrow = "60.0.0"
bytes = "1"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "simdutf8", "zstd"] }
