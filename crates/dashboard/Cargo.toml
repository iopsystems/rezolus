[package]
name = "dashboard"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
# Declares `templates/` as a rebuild trigger; see the file for why.
build = "build.rs"

[dependencies]
metriken-charts.workspace = true
metriken-query.workspace = true
metriken-storage = { workspace = true, features = ["archive"] }
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
include_dir.workspace = true

[dev-dependencies]
histogram.workspace = true
metriken-exposition.workspace = true
metriken-query = { workspace = true, features = ["ingest"] }
tempfile = "3"
