[package]
name = "viewer"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
# `rlib` alongside `cdylib` so this crate can be TESTED. wasm-bindgen's
# generated code compiles for a native target too (the JS interop is what
# would panic there, and none of it runs in these tests), so the behavior a
# browser gets — which container a capture is, which slots an archive fills —
# is checkable without a browser.
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# Fixture builders for `.rez` archives.
rez = { path = "../rez", features = ["test-support"] }
tempfile = "3"

[dependencies]
bytes = "1"
# Workspace declares metriken-query with default-features = false. The browser
# doesn't need the server-side http or ingest features, so we inherit as-is.
metriken-query.workspace = true
dashboard.workspace = true
# The `.rez` reader, WITHOUT its `write` feature: the ingest half pulls
# `metriken`, whose registry declares a `linkme` distributed slice, and
# `linkme` has no wasm32 implementation.
rez = { path = "../rez", default-features = false }
wasm-bindgen.workspace = true
serde.workspace = true
serde_json.workspace = true
console_error_panic_hook.workspace = true
# Force zstd to disable x86 asm for wasm32 builds. Required because
# report-save (transitively) pulls in parquet with the `zstd` feature
# enabled, which compiles zstd to wasm32 via clang.
zstd-sys = { version = "2", default-features = false, features = ["no_asm"] }
# Shared parquet projection + tar repack used by Save as Report; both
# the server viewer and this WASM crate delegate to it.
report-save.workspace = true
