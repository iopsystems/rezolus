[general]
# Specify the sampling interval
interval = "1s"

# Specify the lookback period: how far back the rolling buffer reaches.
# Everything older than this is evicted every tick, which is what keeps the
# buffer file bounded.
duration = "15m"

# Specify the address of the Rezolus Agent
source = "127.0.0.1:4241"

# Specify the path for the snapshot output file. Snapshots are `.rez` archives
# (readable by `rezolus view`, `rezolus mcp` and `rezolus recording metadata`).
output = "/var/lib/rezolus/rezolus.rez"

# Specify the directory the rolling buffer is kept in. It needs room for the
# whole lookback period above, which can be gigabytes.
#
# Defaults to $STATE_DIRECTORY when systemd sets it (the packaged unit declares
# `StateDirectory=rezolus`), otherwise /var/lib/rezolus.
#
# This is deliberately NOT derived from `output`. The snapshot is an artifact
# you keep and choose the location of; the buffer is working state rewritten
# continuously. Do not put it on tmpfs — /tmp and /run are tmpfs on most
# distributions, and a buffer in RAM defeats the point of keeping more history
# than memory holds.
# buffer_dir = "/var/lib/rezolus"

# Optional: rows per sealed segment. Defaults to 4096, which at the 1s interval
# above is one segment per ~68 minutes. Retention and ranged snapshots both work
# in WHOLE segments, so this also sets the granularity at which the buffer trims
# — lower it if you scrape much faster than once a second.
# segment_rows = 4096

# Optional: enable HTTP endpoint for remote dump triggering
# Supports endpoints:
#   GET  /status     - Buffer status: retained time range, per-sampler rows and
#                      segments, on-disk size, and whether retention has started
#   GET  /dump       - Download the buffer as a .rez archive (query params:
#                      start, end, last — selection is by whole segment)
#   POST /dump/file  - Write the buffer to the output file
# listen = "127.0.0.1:4242"

[log]
# Controls the log level: "error", "warn", "info", "debug", "trace"
level = "info"
