[general]
listen = "0.0.0.0:4241"

# Metric snapshots are cached with the following TTL to prevent excessive
# resource usage.
ttl = "10ms"

# External BTF (BPF Type Format) file path (optional)
# This allows Rezolus to run on systems where the kernel doesn't have BTF 
# information built-in at /sys/kernel/btf/vmlinux. 
#
# You can obtain BTF files from:
# - https://github.com/aquasecurity/btfhub (pre-built BTF files for many kernels)
# - Extract from kernel packages (vmlinux or System.map)
# - Generate using pahole from kernel debug symbols
#
# Example:
# btf_path = "/path/to/vmlinux-5.15.0-generic.btf"

# Snapshot wire format served on /metrics/binary and /metrics/json.
#
# "v3" (the default) groups metrics by the read that produced them, and each
# group carries one acquisition window instead of every metric carrying its
# own. That is what makes rate()/irate() uncertainty bands precise, and it
# makes recordings substantially smaller and faster to query — measured at a
# 50ms interval, a .rez archive is 0.39x the size and the same queries run in
# 0.52-0.60x the time.
#
# "v2" is the older flat per-metric format. Set it only if something reading
# this agent cannot handle v3 yet:
#
#   - Anything parsing /metrics/json DIRECTLY. Its shape changes wholesale:
#     a flat `{counters: [...], gauges: [...], histograms: [...]}` becomes
#     `{groups: [{name, schema, counters, gauges, histograms}, ...]}`. This
#     repo's own consumers (exporter, recorder, viewer, MCP, hindsight)
#     handle both and need no change; a homegrown scraper of that endpoint
#     does.
#
#   - A consumer built before SnapshotV3 existed. It cannot decode a v3
#     payload at all. Builds from that era served /metrics as HTTP 200 with
#     an empty body forever and logged nothing at any level — an
#     undiagnosable blackout. Current builds log the decode failure loudly on
#     every failed poll instead, so a mismatch is noisy rather than silent,
#     but only if the consumer is new enough to have that fix.
#
# Rolling back is safe and takes effect on restart: the format is chosen per
# snapshot, nothing on disk records which one produced it, and recordings
# already written stay readable either way.
# snapshot_format = "v3"

# PMU hardware counters to leave free for everything else on the machine.
#
# The core PMU has a small fixed number of counters — commonly 6 per core — and this
# agent's hardware samplers together want more than that. Counters are handed
# out first-come-first-served, so without a reservation the agent takes what it
# can and whatever else wanted one goes without.
#
# That matters most on a hypervisor. KVM backs a guest's virtual PMU with host
# perf events, so an exhausted host PMU leaves guests with a vPMU that reports
# itself working and counts nothing: measured, a guest retiring more than 1e9
# instructions read 395 of them, and from inside the guest a starved counter is
# indistinguishable from a working one.
#
# Default 0 — the agent claims what it can, which is the behaviour that shipped
# before this knob existed. Raising it trades some of this agent's own hardware
# metrics for everyone else's. `/samplers` reports which samplers were skipped
# and how many counters were free when they were considered.
# reserved_pmu_counters = 0

# The order in which PMU samplers claim counters.
#
# A sampler gets its whole event set or none of it, so the order decides who
# runs when there is not enough for everyone. Left unset, the default is:
#
#   cpu_perf, cpu_branch, cpu_dtlb   (core PMU — the contended pool)
#   cpu_l3                           (uncore PMU — its own counters)
#   cpu_frequency                    (free-running MSRs — not allocated)
#
# Only the core-PMU samplers are budgeted. The others draw on separate hardware
# and are never refused, so reordering them has no effect today.
#
# cpu_perf leads because cycles+instructions is the base IPC signal every other
# CPU metric is read against. The rest is a judgment call — override it when
# your investigation disagrees, e.g. someone chasing cache behaviour wanting
# cpu_l3 to outrank cpu_perf. Samplers omitted from the list keep their default
# rank behind the ones named, so a partial list cannot silently drop one.
# pmu_priority = ["cpu_perf", "cpu_branch", "cpu_dtlb", "cpu_l3", "cpu_frequency"]

# Enable host-wide BPF run-time statistics so `rezolus_bpf_run_time` and
# `rezolus_bpf_run_count` populate (mean ns/call per sampler — the principle-16
# self-telemetry used to size sampler overhead).
#
# OFF by default, and deliberately. The kernel has a single global switch for
# run-time accounting; turning it on adds two clock reads to EVERY BPF program
# run on the host, not just Rezolus's. On a box running XDP at line rate,
# cilium, or other heavy BPF, that is a real per-event tax on programs the agent
# does not own. Rezolus enables it through a BPF_ENABLE_STATS fd held for its
# lifetime, so it turns back off when the agent exits (no lingering
# `kernel.bpf_stats_enabled` sysctl) — but while on it is still host-wide.
#
# Leave it off in normal operation; turn it on only while actively investigating
# sampler overhead, and prefer a host that is not saturating other BPF programs.
# bpf_stats = false

[scheduler]
# By default, Rezolus will use the SCHED_RR realtime scheduling policy to ensure
# collection happens with minimal delay. Other policies are: `normal` and `fifo`
# policy = "round_robin"

# When using `round_robin` or `fifo` realtime policies, a priority may be set
# in the range 1..=99. Larger numbers are higher priority. Rezolus uses a
# default priority of 15 to balance between realtime responsiveness and safety.
# priority = 15

# When using `normal` scheduling policy, Rezolus defaults to the normal niceness
# value of 0. The value may be in the range -20..=19 with lower values getting
# higher priority.
# niceness = 0

[log]
# Controls the log level: "error", "warn", "info", "debug", "trace"
level = "info"

# External metrics ingestion via Unix domain socket.
# Allows external processes to push metrics into Rezolus.
# [external_metrics]
# enabled = true
# socket_path = "/var/run/rezolus/external.sock"
# protocol = "auto"  # "binary" | "line" | "auto"
# metric_ttl = "60s"
# max_connections = 1000
# max_metrics = 100000
# max_metrics_per_connection = 10000
# socket_group = "rezolus"
# socket_mode = 0o770

# The defaults are used for each sampler unless there's a sampler level
# configuration present.

[defaults]
# Controls whether the samplers are enabled or not. Setting the default to
# true means that individual sampler configs can be used to opt-out of
# collection for that sampler. Setting the default to false requires that
# individual sampler configs are used to opt-in to collection.
enabled = true

# Each sampler can then be individually configured to override the defaults. All
# of the configuration options in the `[defaults]` section are allowed.

# BPF sampler that instruments the block_io request queue to measure each phase
# of a request's life: how long it waited in the queue (`blockio_queue_latency`),
# how long the device then took (`blockio_device_latency`), and the two together
# (`blockio_total_latency`).
[samplers.blockio_latency]

# BPF sampler that instruments block_io request queue. Produces per-op
# completion counts, byte counters, size histograms, terminal-failure
# counters bucketed by error class, and requeue counters.
[samplers.blockio_requests]

# BPF sampler that collects CPU CFS bandwidth control and throttling stats
[samplers.cpu_bandwidth]

# Reads the number of currently online cores
[samplers.cpu_cores]

# Performance Counter based sampler that gathers APERF, MPERF, and TSC which can
# be used to calculate CPU frequency
[samplers.cpu_frequency]

# Performance counter based sampler that gathers branch instructions and
# mispredictions.
[samplers.cpu_branch]

# Performance counter based sampler that gathers DTLB (Data TLB) misses.
[samplers.cpu_dtlb]

# Performance counter based sampler that gathers L3 cache accesses and misses.
[samplers.cpu_l3]

# Instruments CPU migrations.
[samplers.cpu_migrations]

# Instruments CPU frequency, instructions, and cycles using perf counters.
[samplers.cpu_perf]

# BPF sampler that gathers TLB flush event counts by reason.
[samplers.cpu_tlb_flush]

# Instruments CPU usage by state with BPF on linux. On macos
# host_processor_info() is used
[samplers.cpu_usage]

# Reports per-drive temperature for NVMe and SATA drives via read-only
# pass-through ioctls (like smartctl) — no kernel module required. Drives are
# discovered once at startup. Because each read is a device command and
# temperature moves slowly, reads are throttled to `interval` (default 60s) and
# run off the scrape/TTL cycle. Needs CAP_SYS_RAWIO (already held for eBPF);
# unprivileged or with no supported drive it emits no series.
[samplers.drivehealth]
# interval = "60s"

# Produces nVIDIA GPU metrics using NVML and optionally CUPTI PM sampling.
# CUPTI PM sampling (SM utilization, DRAM throughput, L2 hit rate, occupancy)
# requires Turing+ GPU and is only available when built with --features cupti.
[samplers.gpu_nvidia]

# Produces AMD GPU metrics using the ROCm SMI library (librocm_smi64.so),
# loaded at runtime. Disabled automatically on hosts without ROCm or AMD GPUs.
[samplers.gpu_amd_smi]

# Produces AMD GPU hardware performance counter metrics (waves, VALU,
# instruction/L1/L2 caches, memory-bandwidth requests) via rocprofiler-sdk's
# device counting service, loaded at runtime. Requires the CAP_PERFMON
# capability. Disabled automatically on hosts without ROCm or AMD GPUs. Note:
# on RDNA GPUs some counters only read non-zero when the GPU is in a stable
# power state (see docs/amd_gpu_counters.md); this sampler does not change the
# power state. When the PMU is enabled, AMD HSA runtime system creates one background thread that
# keeps busy polling, that could push the Rezolus CPU utilization to 100% on one core.
# This high CPU utilization might cause problem for some applications, so we disable this sampler by default.
#
# This sampler is OPT-IN ONLY: it is never enabled by the [defaults] section. It
# stays off unless this section explicitly sets `enabled = true` (commenting the
# section out leaves it disabled, not enabled).
[samplers.gpu_amd_pmu]
enabled = false
# Optionally pin the AMD GPU performance level at startup. Default (unset) leaves
# the power state untouched. Many RDNA per-SIMD counters (VALU/SALU/LDS, L2/VRAM
# bandwidth) only read non-zero in a stable power state. One of: auto, low, high,
# manual, stable_std, stable_peak, stable_min_mclk, stable_min_sclk, determinism.
# Requires amd-smi on PATH. Note: stable_* levels pin clocks and perturb real
# workloads, so use with care on production hosts.
# gpu_perf_level = "stable_std"

# Memory utilization from /proc/meminfo
[samplers.memory_meminfo]

# Memory NUMA metrics from /proc/vmstat
[samplers.memory_vmstat]

# Reads ENA (Elastic Network Adapter) driver statistics via ethtool ioctls to
# expose AWS EC2 allowance exceeded counters for bandwidth, PPS, connection
# tracking, and link-local traffic. Does nothing on non-ENA interfaces.
[samplers.network_ethtool]

# Produces network interface statistics from /sys/class/net for TX/RX errors
[samplers.network_interfaces]

# Produces network traffic statistics using BPF
[samplers.network_traffic]

# Sample resource utilization for Rezolus itself
[samplers.rezolus_rusage]

# BPF sampler that instruments scheduler events and measures runqueue latency,
# process running time, and context switch information.
[samplers.scheduler_runqueue]

# BPF sampler that instruments syscall enter to gather syscall counts.
[samplers.syscall_counts]

# BPF sampler that instruments syscall enter and exit to gather syscall latency
# distributions.
[samplers.syscall_latency]

# BPF sampler that probes TCP connect (active open) to measure latency when
# establishing connections.
[samplers.tcp_connect_latency]

# BPF sampler that probes TCP receive path to measure latency from a packet
# being received until application reads from the socket.
[samplers.tcp_packet_latency]

# BPF sampler that probes TCP receive path to measure jitter and smoothed round
# trip time.
[samplers.tcp_receive]

# BPF sampler that probes TCP retransmit path to measure retransmits.
[samplers.tcp_retransmit]

# Samples TCP traffic using a BPF sampler to get metrics for TX/RX bytes and
# packets
[samplers.tcp_traffic]

# Samples GPU metrics on Apple Silicon using powermetrics
[samplers.gpu_apple]
enabled = true
