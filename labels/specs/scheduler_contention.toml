name = "labels-scheduler-contention"

[metadata]
class = "scheduler_contention"

[[jobs]]
name = "sut"
tags = ["z1.baremetal"]

# NOTE: the content below is a verbatim copy of labels/ground_truth/scheduler_contention.json.
# There is no automated sync — if that file changes, update this write_file step by
# hand to match (see labels/README.md's metric-name calibration caveat).
[[jobs.steps]]
type = "write_file"
path = "/tmp/ground_truth.json"
content = """
{
  "schema_version": 1,
  "class": "scheduler_contention",
  "subsystem": "scheduler",
  "mechanism": "runqueue_latency",
  "direction": "runnable tasks queuing behind oversubscribed cores",
  "induced_window_s": [60.0, 180.0],
  "expected_signals": [
    { "metric": "scheduler_runqueue_latency:p99", "check": "ElevatedInWindow" },
    { "metric": "cpu_usage", "check": "RegimeShiftIncreaseInWindow" },
    { "metric": "scheduler_runqueue_latency:p99", "check": "SubsystemPresent" }
  ],
  "experiment": {
    "spec_file": "labels/specs/scheduler_contention.toml",
    "params": { "baseline_s": "60", "induce_s": "120", "cooldown_s": "60", "oversubscription": "4x nproc" },
    "host_tag": "z1.baremetal"
  }
}
"""

[[jobs.steps]]
type = "shell"
command = """
set -euo pipefail
BASELINE=60
INDUCE=120
COOLDOWN=60
# --- recorder: pinned prerelease, EXTRACTED not installed (job shell is not root;
#     record --url/.rez is client-side, so the extracted binary suffices) ---
REZOLUS_TAG="v5.17.1-alpha.8"
REZOLUS_VER="5.17.1-alpha.8"
. /etc/os-release
ARCH=$(dpkg --print-architecture)
ARCH_LABEL=$([ "$ARCH" = "amd64" ] && echo x86 || echo arm64)
ASSET="${ID}_${VERSION_CODENAME}_${ARCH_LABEL}_rezolus_${REZOLUS_VER}-0_${ARCH}.deb"
curl -fsSL -o /tmp/rezolus.deb "https://github.com/iopsystems/rezolus/releases/download/${REZOLUS_TAG}/${ASSET}"
rm -rf /tmp/rezolus-prerelease
dpkg-deb -x /tmp/rezolus.deb /tmp/rezolus-prerelease
RECORDER=/tmp/rezolus-prerelease/usr/bin/rezolus
$RECORDER --version
command -v stress-ng >/dev/null
# --- agent: the host's system agent is the metrics source (any version serves;
#     acquisition windows require agent >= 5.17.1-alpha — see runbook calibration) ---
for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:4241/metrics/json && break; sleep 1; done
# --- record (background), induce phase, wait for the recorder ---
TOTAL=$((BASELINE + INDUCE + COOLDOWN + 10))
$RECORDER record --url http://localhost:4241 -o /tmp/recording.rez --interval 1s --duration ${TOTAL}s --metadata class=scheduler_contention &
RECORD_PID=$!
sleep $BASELINE
stress-ng --cpu $((4 * $(nproc))) --timeout ${INDUCE}s
sleep $COOLDOWN
wait $RECORD_PID
"""

[[jobs.steps]]
type = "upload_artifact"
path = "/tmp/recording.rez"
name = "recording.rez"

[[jobs.steps]]
type = "upload_artifact"
path = "/tmp/ground_truth.json"
name = "ground_truth.json"
